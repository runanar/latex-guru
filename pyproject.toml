[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-rag-topology-assistant"
version = "0.1.0"
description = "El yazisi destekli matematik ve topoloji kitabi asistani"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rana Nur Ceylan" }]
dependencies = [
    "streamlit>=1.35.0,<2.0.0",
    "chromadb>=0.5.0,<0.6.0",
    "google-genai>=0.1.1,<1.0.0",
    "pillow>=10.3.0,<11.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "torchvision>=0.18.1,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0", "ruff>=0.6.0,<1.0.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"